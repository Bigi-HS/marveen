# gitleaks config for the Genesis fleet repo (card ea3720b3).
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
#
# ALLOWLIST strategy: suppress ONLY known-safe patterns that appear in test
# fixtures (fictive paths/values) and in fleet operational idioms that grep
# would also skip. Do NOT allowlist patterns that appear in real secret files.
#
# IMPORTANT: per-rule [rules.allowlist] suppresses only that rule's findings.
# Patterns that should be suppressed across ALL default rules must go into the
# global [allowlist] block (applied before any rule fires).

title = "genesis-fleet"

[extend]
# Use the upstream default ruleset as the base; extend/override below.
useDefault = true

[allowlist]
description = "Global allowlist -- patterns safe across all files"
regexes = [
  # Fleet dashboard token READ idiom: `$(cat store/.dashboard-token)` appears in
  # every fleet-ops recipe. The token file itself is gitignored; the shell
  # command is not a secret value. Must be in the global allowlist so it
  # suppresses all default rules (a per-rule allowlist only suppresses that rule).
  '''\$\(cat store/\.dashboard-token\)''',
  # Model IDs (e.g. claude-sonnet-4-6 in comments/configs)
  '''claude-[a-z]+-\d+''',
  # Markdown/doc token references with no value
  '''`?\$\{?TOKEN\}?`?''',
  # Cron-style strings caught by some entropy rules
  '''[0-9] \* \* \* ''',
  # Test-fixture placeholder values (fictive paths, fakeuser)
  '''/home/fakeuser/''',
  '''fakeuser''',
  '''placeholder''',
  '''example\.com''',
  '''EXAMPLE''',
  '''test-only''',
  # gitleaks high-entropy false-positives on repeating base64 content in tests
  '''a{16,}''',
]
paths = [
  # Changelog / release notes: may quote old tokens as examples
  '''CHANGELOG.*''',
  # The install script itself contains the SHA256 checksum (not a secret)
  '''scripts/install-gitleaks\.sh''',
  # Test fixtures: fictive secrets are expected
  '''src/__tests__/.*''',
  '''scripts/hooks/test_.*''',
]
